[PHP]
; Configuration pour le serveur interne Electron (IMPOT 3CE)

; Répertoire des extensions
extension_dir = "ext"

; Activation des extensions nécessaires pour SQLite et MySQL
extension=pdo_sqlite
extension=sqlite3
extension=pdo_mysql
extension=mysqli

; Autres extensions utiles
extension=curl
extension=mbstring
extension=openssl

; Paramètres par défaut
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
date.timezone = "UTC"

; Erreurs (masquées en production, visibles pour le moment)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
