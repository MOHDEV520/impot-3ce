<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Top Blue Block -->
  <rect x="100" y="50" width="300" height="160" fill="#5c7cff" />
  
  <!-- Middle Section -->
  <g transform="translate(250, 310)">
    <!-- Main Text "3 E" in Black -->
    <text x="-90" y="0" font-family="Arial Black, Helvetica, sans-serif" font-size="140" font-weight="900" fill="#000000">3</text>
    <text x="35" y="0" font-family="Arial Black, Helvetica, sans-serif" font-size="140" font-weight="900" fill="#000000">E</text>
    
    <!-- Central "C" in semi-transparent blue -->
    <text x="0" y="5" font-family="Arial Black, Helvetica, sans-serif" font-size="190" font-weight="900" fill="#5c7cff" fill-opacity="0.45" text-anchor="middle">C</text>
  </g>
  
  <!-- Bottom Blue Block -->
  <rect x="90" y="340" width="320" height="40" fill="#5c7cff" />
  <text x="250" y="370" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="8">FISCUS</text>
</svg>
